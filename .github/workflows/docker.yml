# Builds the Docker image and publishes it to GitHub Container Registry.
# Triggers only on the deploy branch for now; add master here once the fix is merged.
name: Build and publish Docker image

on:
  push:
    branches:
      - fix/in-process-discord-recovery
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '(?<=BuildVersion = ")v[0-9.]+' Requestrr.WebApi/RequestrrBot/Locale/Language.cs)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tukkordo/requestrr:${{ steps.version.outputs.version }}
